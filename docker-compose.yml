version: '3.8'

services:
  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: zenit-db
    restart: always
    environment:
      MYSQL_DATABASE: cerebro_editorial
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: user_password
      MYSQL_USER: zenit_user
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Servidor Web Express
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenit-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://zenit_user:user_password@db:3306/cerebro_editorial
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - db
    command: ["pnpm", "start"]

  # Bot de Automatización
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenit-bot
    restart: always
    environment:
      - API_URL=http://web:3000
      - ZENIT_CONFIG_PATH=/app/config.json
      - DATABASE_URL=mysql://zenit_user:user_password@db:3306/cerebro_editorial
    depends_on:
      - web
    command: ["python3", "main_runner.py", "--api", "http://web:3000", "--config", "config.json"]
    volumes:
      - ./config.json:/app/config.json
      - ./logs:/app/logs

  # Rastreador RSS
  rss-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenit-rss
    restart: always
    environment:
      - API_URL=http://web:3000
    depends_on:
      - web
    command: ["python3", "rss_monitor.py", "--api", "http://web:3000", "--project", "1", "--feeds", "https://www.technologyreview.com/feed/,https://www.wired.com/feed/category/science/latest/rss"]

volumes:
  db_data:
